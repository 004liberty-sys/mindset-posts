name: インスタ自動投稿

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分ごとに確認（GitHubの混雑で数分〜数十分遅れることがある）
  workflow_dispatch: {}      # 手動で今すぐ動かすボタン

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 必要な部品を入れる
        run: pip install pynacl
      - name: 予定時刻を過ぎた投稿を出す
        run: python publish/post_due.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: 投稿の記録を保存
        if: always()
        run: |
          git config user.name "mindset-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publish/posted.json publish/token_state.json
          git diff --cached --quiet || (git commit -m "投稿の記録を更新" && git push)
